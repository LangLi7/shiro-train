[package]
name = "shiro-dashboard"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Lokales Trainings-Dashboard fuer Shiro: liest logs/*.jsonl und checkpoints/ und zeigt Fortschritt im Browser"
license = "MIT OR Apache-2.0"
publish = false

# Bewusst KEIN Mitglied des Shiro-Workspace.
#
# Zwei Gruende:
#   1. Das Haupt-Crate ist zeitweise durch fremde Dateien blockiert
#      (z. B. src/data/games.rs). Dieses Werkzeug muss trotzdem baubar bleiben.
#   2. Es importiert die Shiro-Lib NICHT - es liest nur Dateien. Damit kann es
#      keinen Trainingspfad beeinflussen.
#
# Der eigene [workspace]-Schluessel haelt Cargo davon ab, diesen Ordner dem
# Elternprojekt zuzuordnen.
[workspace]

# Keine Abhaengigkeiten. Der JSONL-Parser ist selbst geschrieben, damit das
# Werkzeug ohne Netzwerkzugriff und ohne Lockfile-Drift baubar ist.
[dependencies]

[[bin]]
name = "shiro-dashboard"
path = "src/main.rs"

[profile.release]
opt-level = 2
