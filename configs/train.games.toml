# Trainingslauf auf dem Spiele-Korpus (alle Spiel-Umgebungen).
#
# Zweck: `shiro validate-data --config configs/train.games.toml` prueft die mit
# `shiro data generate-games` erzeugten Shards in beiden Stufen. Die Werte unter
# [model] sind auf die gemessene Datensatzlaenge abgestimmt:
#
#   laengster Datensatz : 430 B (gemessen, n = 60, Seed 1337)
#   Empfehlung          : seq_len >= max_record_len, sonst schneidet der Loader
#                         den Denkweg ab (siehe src/data/loader.rs::batch)
#
# seq_len = 960 laesst jeden Datensatz vollstaendig in ein Fenster passen. Die
# Spielarten sind bewusst klein gehalten (Labyrinth bis 9x9, Rush Hour 6x6,
# Schiebepuzzle 3x3, Hanoi bis 6 Scheiben, Packen bis 4x5, Gitter bis 6x6);
# damit bleibt der Denkweg kurz genug fuer das Kontextbudget.

[run]
name = "games"
seed = 1337
steps = 16
log_every = 1
checkpoint_every = 16
output_dir = "checkpoints"
log_dir = "logs"

[data]
# Zeigt auf den Trainingsordner des Korpus. Fuer die Held-out-Menge auf
# data/games/val umstellen - die Trennung ist gewollt und soll sichtbar bleiben.
dir = "data/games/train"
manifest = "manifest.json"
batch_size = 2
seq_len = 960
shuffle = false

[model]
d_model = 32
n_layers = 2
n_heads = 2
d_ff = 64
vocab_size = 256
max_seq_len = 960

[optim]
lr = 0.05
weight_decay = 0.0
grad_clip = 1.0
warmup_steps = 1
schedule = "constant"

[precision]
weights = "fp32"
autocast = "bf16"
