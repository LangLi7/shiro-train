# Registrierte Hypothese (R329 Budget-Entscheid): 9000 → 10500 Schritte.
# Letzter Lauf mit Restguthaben (1,58 $). EIN Faktor: Schrittzahl.
# Resume vom 70%-Modell (steps9000-step9000.state), gleicher Korpus/lr/Seed.
#
# Erwartung: Antwort-EM > 70 %. Widerlegung: <= 70 %.
# Budget: 1500 Schritte (~40 min, ~1,46 $).

[run]
name = "steps10500"
seed = 53013
steps = 1500
log_every = 100
checkpoint_every = 1500
output_dir = "/workspace/500m-10500/ckpt"
log_dir = "/workspace/500m-10500/logs"

[data]
dir = "/root/fokus-train"
manifest = "manifest.json"
batch_size = 6
seq_len = 1024
shuffle = false
pack = true

[model]
name = "mix500"
d_model = 1280
n_layers = 32
n_heads = 20
d_ff = 2432
vocab_size = 256
max_seq_len = 1024
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 100
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
