# Zero-Shot-Boden auf den Kontextaufgaben, ohne jeden Trainingsschritt.
#
# Gemessen wird auf der **Held-out**-Menge (`val/`), nicht auf den Trainingsdaten:
# der Boden soll sagen, was ein ungeuebtes Modell auf neuen Aufgaben trifft.
#
# Aufruf:
#   shiro eval --config configs/eval.kontext-zero.toml --answers 20 \
#     --answers-mode m1 --untrained
#
# `--untrained` laesst den Checkpoint weg: `Lm::new` erzeugt alle Gewichte
# gleichverteilt nach Seed, das ist der Nullpunkt.

[run]
name = "eval-kontext-zero"
seed = 1337
steps = 1
log_every = 1
checkpoint_every = 1
output_dir = "checkpoints"
log_dir = "logs"

[data]
dir = "out/kontext-neu/val"
manifest = "manifest.json"
batch_size = 4
seq_len = 256
shuffle = false

[model]
name = "shiro-micro"
d_model = 256
n_layers = 6
n_heads = 4
d_ff = 640
vocab_size = 256
max_seq_len = 512
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 5
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
