# Registrierte Hypothese (Runde 329): noch mehr Schritte -> naeher an 90 %.
# Fortsetzung vom 55%-Modell (longer500-step6000.state) um 3000 Schritte
# (= 9000 gesamt). EIN Faktor: Schrittzahl 6000 -> 9000.
# Alles gleich: Korpus (fokus 12.818), lr 3e-4 cosine, Seed 53013, Batch 6.
#
# Erwartung: Antwort-EM > 55 % (besser als der 6000er Stand).
# Widerlegung: <= 55 % -> die Schrittzahl ist bei 6000 bereits ausgereizt.
# Budget: 3000 Schritte (~78 min, ~2,85 $). Guthaben 4,55 $.

[run]
name = "steps9000"
seed = 53013
steps = 3000
log_every = 100
checkpoint_every = 3000
output_dir = "/workspace/500m-9000/ckpt"
log_dir = "/workspace/500m-9000/logs"

[data]
dir = "/root/fokus-train"
manifest = "manifest.json"
batch_size = 6
seq_len = 1024
shuffle = false
pack = true

[model]
name = "mix500"
d_model = 1280
n_layers = 32
n_heads = 20
d_ff = 2432
vocab_size = 256
max_seq_len = 1024
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 100
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
