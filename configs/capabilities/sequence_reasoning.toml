# Capability "sequence_reasoning" (Nutzer-Spec §1).
#
# Diese Datei ist der VERTRAG des agentischen Loops: welche Fertigkeiten die
# Faehigkeit umfasst, wie gemessen wird, wann sie als bestanden gilt und wie
# der Capability-Score gewichtet wird. **Keine dieser Zahlen steht im Code** -
# `src/agent.rs` liest sie hier.
#
# Bezug: docs/agentic-loop.md, docs/zahlenfolgen-korpus.md (Familie D-045).
# Die sechs Regeln sind genau der Katalog aus src/data/seq.rs.

id = "sequence_reasoning"
level = "L2/L3 (Zahlenfolgen und Regelausfuehrung)"

# Die sechs Regeln des Katalogs als Einzelfertigkeiten (Spec §1 "skills").
skills = [
  "constant_difference",
  "constant_factor",
  "recursive_sum",
  "growing_difference",
  "interleaved_difference",
  "double_plus_same",
]

# Was gemessen wird (Spec §4). Nicht gebaute Saetze stehen auf false und
# werden als "nicht gemessen" berichtet, nicht als 0 % gewertet.
[evaluation]
exact_match = true
held_out = true
compositional = false
adversarial = false

# **Metrik-Schaerfung (gemessener Grund).** Der Typ `vergleich` hat einen
# 1-Byte-Antwortraum ('A'/'B') und eine Shortcut-Baseline von 49,3 %. Im ersten
# Loop-Lauf kamen ALLE fuenf Treffer von 48 aus `vergleich` (3/3) und `stelle`
# (1/6), waehrend die fuenf inhaltlichen Typen zusammen 0 von 39 standen. Eine
# Kopfzahl, die solche Typen mitzaehlt, misst den Antwortraum, nicht die
# Faehigkeit. Deshalb: diese Typen werden GETRENNT berichtet und gehen NICHT in
# `exact_match_content` und damit nicht in den Score ein.
[metric]
kurzantwort_typen = ["vergleich"]

[pass_criteria]
# Trefferquote auf dem festen Referenzsatz (120 Datensaetze, jeder 41.).
#
# **0.90 statt 0.60 (exp-010, D-047).** Die alte Schwelle 0,60 war mit 84,2 %
# laengst erfuellt - und hat den Loop dadurch **angehalten**: `passes()` meldete
# "Schwellen erfuellt", es wurde nicht mehr trainiert, obwohl drei Aufgabentypen
# unter 75 % lagen. Eine Schwelle, die unter dem Projektziel liegt, ist kein
# Fortschrittsmass, sondern eine Bremse. Sie ist jetzt die D-047-Marke.
exact_match_min = 0.90
# **D-047: kein inhaltlicher Aufgabentyp unter 75 %.** Begruendung im Register
# (D-047): bei der kleinsten Stichprobe (n = 12) verlangt 75 % mindestens
# 9 Treffer, also mehr als ein Zufallstreffer; 0 von 12 (der reparatur-Fall)
# kann damit nicht mehr neben einer erfuellten Gesamtquote stehen.
typ_min = 0.75
# Verlust auf dem Held-out-Band (gemessen auf den ersten vier Batches).
held_out_loss_max = 0.80
# Erlaubter Anstieg des Verlusts auf dem TRAININGSBAND (Regression, Spec §9).
regression_drop_max = 0.05
# Mindest-Gewinn des Scores, damit ein Stand uebernommen wird.
score_gain_min = 0.01
# compositional_min und adversarial_min fehlen bewusst: es gibt noch keine
# Saetze dafuer (O-Z6/O-Z8/O-Z9). Sobald sie existieren, hier eintragen.

# Score-Gewichte (Spec §9). Anpassbar - die Defaults der Spec sind 0.35/0.25/0.20/0.20.
[score]
exact_match = 0.35
held_out = 0.25
compositional = 0.20
adversarial = 0.20

[budget]
max_iterations = 3
# Der feste Referenzsatz. KORREKTUR einer alten Schaetzung: die erste Fassung
# rechnete mit ~30 s je Datensatz (abgeleitet aus exp-002). Der Trockenlauf des
# Loops hat 8 Datensaetze in ~10 s gemessen, also ~1,3 s je Datensatz.
#
# **120 statt 48 (exp-010, n18a).** Gemessener Anlass: mit 48 Datensaetzen auf
# acht Aufgabentypen entfallen nur 3-6 auf jeden Typ. In exp-009 enthielt der
# Satz genau DREI zweiteilige `reparatur`-Datensaetze (das 120er-Panel hat 16) -
# der Loop hat die Runde deshalb angenommen, obwohl dieser Typ im Panel von
# 9/16 auf 2/16 einbrach. Eine Annahmeregel, die eine Typ-Regression nicht sehen
# kann, ist keine Annahmeregel. Die Kostenschaetzung, die den Satz klein hielt,
# ist ueberholt: die Sonde erzeugt mit Budget `soll.len()+2` und misst 120
# Datensaetze in Minuten.
eval_records = 120
regression_records = 32
# **Dosis 600 statt 150 (genehmigter naechster Schritt 1).** Gemessener Grund:
# 150 Schritte x Batch 16 = 2400 Datensaetze, der Trainingsshard hat 50.000 -
# der erste Loop-Lauf sah also **4,8 %** des Korpus ein einziges Mal. Bei so
# wenig Dosis ist "0 von 39 inhaltlichen Treffern" eine Aussage ueber die Dosis,
# nicht ueber die Faehigkeit. 600 Schritte = 9600 Datensaetze = 19,2 % einmal.
train_steps = 600
plateau_patience = 2
# Anteil Wiederholung aus dem urspruenglichen Trainingsband gegen Vergessen.
replay_share = 0.35
