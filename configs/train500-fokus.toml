# Registrierter Hypothesen-Test (Runde 304/308).
# EIN Faktor gegenueber Lauf 2: der Trainingskorpus.
# Vorher: 20-Familien-Misch (51 % Wortantworten) -> 0 % Antwort-EM.
# Jetzt:  fokussierter Rechenkorpus, 100 % reine Zahlenantworten.
# Gleich bleiben: Architektur (509298176 Parameter), Seed, lr, schedule, precision.
# Basis: Lauf-2-Checkpoint Schritt 2000 (--resume .state).
#
# Erwartung: Antwort-EM > 20 %. Widerlegung: <= 20 %.
# Budget: 2000 Schritte (~52 min, ~1,90 $), Checkpoint alle 1000.

[run]
name = "fokus500"
seed = 53013
steps = 2000
log_every = 100
checkpoint_every = 1000
output_dir = "/workspace/500m-fokus/ckpt"
log_dir = "/workspace/500m-fokus/logs"

[data]
dir = "/workspace/fokus-rechnen/train"
manifest = "manifest.json"
batch_size = 6
seq_len = 1024
shuffle = false
pack = true

[model]
name = "mix500"
d_model = 1280
n_layers = 32
n_heads = 20
d_ff = 2432
vocab_size = 256
max_seq_len = 1024
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 100
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
