# Schneller echter Trainingslauf: Micro-Modell (4.656.640 Parameter) auf dem
# Beispielkorpus. Beweist in Sekunden, dass der Burn-Pfad den Loss senkt, bevor
# der grosse Lauf (configs/train.micro.toml) gestartet wird.
#
# Aufruf:  shiro train --config configs/train.micro-smoke.toml

[run]
name = "micro-smoke"
seed = 1337
steps = 20
log_every = 1
checkpoint_every = 20
output_dir = "checkpoints"
log_dir = "logs"

[data]
dir = "data/sample"
manifest = "manifest.json"
batch_size = 8
seq_len = 128
shuffle = false

[model]
name = "shiro-micro"
d_model = 256
n_layers = 6
n_heads = 4
d_ff = 640
vocab_size = 256
max_seq_len = 512
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 5
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
