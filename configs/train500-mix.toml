# **500M auf gemischtem Korpus (Runde 465).**
#
# Der Lauf, der das Ziel traegt: 500M Parameter auf ~10 GB Korpus aus sauberem
# Wikipedia-Fliesstext und verifizierten Aufgaben aus 17 Familien.
#
# ## Was gegenueber dem widerlegten 509M-Lauf anders ist
#
# Der erste 509M-Lauf endete bei 0 von 60 Treffern (p = 0,0004). Die Ursache war
# **nicht** die Groesse, sondern der Zuschnitt: 84 MB Korpus mit **einer Vorlage je
# Familie**. Ein Modell, das die Vorlage kennt, beantwortet alle Datensaetze, ohne zu
# rechnen - der Verlust faellt, die Faehigkeit bleibt null.
#
# Drei Faktoren sind hier anders, und sie sind **vorher festgelegt**, nicht nachtraeglich
# angepasst:
#
#   1. **Korpus 10,2 GB statt 84 MB** - 121x mehr, die Chinchilla-Groessenordnung
#   2. **Aufgaben mit 20 Satzbaumustern** statt einer Vorlage (`vielfalt.rs`)
#   3. **Aufgaben 20x verschraenkt** ueber den Text, nicht am Ende gesammelt
#
# ## Die vorregistrierte Abbruchregel
#
# **Messpunkt bei Schritt 2 000** (5,7 % des Laufs, ~2,2 GPU-Stunden, ~4,80 $):
#   - Weg-EM **< 2 %**  -> **Abbruch**. Dann traegt der Zuschnitt nicht, und weitere
#                          700 Stunden aendern nichts.
#   - Weg-EM **2-10 %** -> weiter bis Schritt 10 000, dann erneut entscheiden.
#   - Weg-EM **> 10 %** -> weiter bis 85 000 (eine Epoche).
#
# **Diese Regel steht vor dem Start fest.** Sie nachtraeglich zu lockern waere genau
# der Fehler, den der Auftrag verbietet.

[run]
name = "gross-mix"
seed = 20261121
# 10,2 GB bei 6 x 1024 Byte je Schritt: 10 200 000 000 / 6144 = 1 660 156 Schritte
# fuer eine Epoche. Bei 3 960 Byte/s sind das 716 GPU-Stunden.
steps = 85000
log_every = 100
checkpoint_every = 5000
output_dir = "/workspace/ckpt-gross"
log_dir = "/workspace/logs"

[data]
dir = "/workspace/korpus500/mix"
manifest = "manifest.json"
batch_size = 6
seq_len = 1024
shuffle = false

[model]
name = "gross"
d_model = 1280
n_layers = 32
n_heads = 20
d_ff = 2432
vocab_size = 256
max_seq_len = 1024
rope_theta = 10000.0
rms_norm_eps = 1e-05
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 1000
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
