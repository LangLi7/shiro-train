# Runde 363: Cache plus Verfahren.
#
# Der Nutzer hat den Punkt gemacht: auswendig Gelerntes ist ein Cache, kein
# Fehler. Ein Mensch ruft das kleine Einmaleins ab und rechnet nur die
# grossen Faelle schriftlich. Das Modell soll dasselbe tun.
#
# Korpus `mix-100k`: 29 % zweistellig (Cache), 24 % dreistellig (Uebergang),
# 47 % vier- bis fuenfstellig (Verfahren). 56.661 unique, 44,5 % Ueberlappung
# mit dem alten Training - der Cache-Anteil, gewollt.
#
# EIN Faktor: Korpus (Zahlenbereich und Mischung).
# GLEICH: Prosa-Format, lr 3e-4 cosine, Seed 53013, Architektur 500M,
# Resume vom 73%-Modell, 5000 Schritte.
#
# GEMESSEN WIRD auf `gross-100k/val` (4-5-stellig, 0 % Ueberlappung,
# Baseline 0,0 % bei 30 Records) - dort zaehlt das Verfahren, nicht der Cache.
# Schutz: alter Heldout (Baseline 73 %).
# Budget: 5000 Schritte ~2,2 h ~4,8 $.

[run]
name = "mix500"
seed = 53013
steps = 5000
log_every = 100
checkpoint_every = 5000
output_dir = "/workspace/500m-mix/ckpt"
log_dir = "/workspace/500m-mix/logs"

[data]
dir = "/root/mix-train"
manifest = "manifest.json"
batch_size = 6
seq_len = 1024
shuffle = false
pack = true

[model]
name = "mix500"
d_model = 1280
n_layers = 32
n_heads = 20
d_ff = 2432
vocab_size = 256
max_seq_len = 1024
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 100
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
