# Zero-Shot-Boden der **500M-Architektur** auf den Kontextaufgaben.
#
# Warum diese Datei neben `eval.kontext-zero.toml` steht: der Boden der kleinen Form
# sagt nichts ueber die grosse. Der Nullpunkt muss mit **derselben Architektur** gemessen
# werden, die trainiert werden soll - sonst vergleicht man spaeter zwei Modelle.
#
# Lokal auf der CPU, damit die Messung nichts kostet:
#   shiro eval --config configs/eval.kontext-zero-500.toml --answers 10 \
#     --answers-mode m1 --untrained
#
# Die Modellwerte sind aus `train500.toml` uebernommen; geaendert ist nur `seq_len`,
# weil ein Kontextdatensatz im Mittel 177 Byte gross ist.

[run]
name = "eval-kontext-zero-500"
seed = 53013
steps = 1
log_every = 1
checkpoint_every = 1
output_dir = "checkpoints"
log_dir = "logs"

[data]
dir = "out/kontext-neu/val"
manifest = "manifest.json"
batch_size = 1
seq_len = 512
shuffle = false

[model]
name = "mix500"
d_model = 1280
n_layers = 32
n_heads = 20
d_ff = 2432
vocab_size = 256
max_seq_len = 512
rope_theta = 10000.0
rms_norm_eps = 1e-5
tie_embeddings = false
dropout = 0.0

[optim]
lr = 0.0003
weight_decay = 0.1
grad_clip = 1.0
warmup_steps = 800
schedule = "cosine"

[precision]
weights = "fp32"
autocast = "fp32"
